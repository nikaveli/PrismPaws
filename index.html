<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="icon" type="image/png" href="/assets/images/PRISM_PAWS_BADGE.png" />
  <link rel="apple-touch-icon" href="/assets/images/PRISM_PAWS_BADGE.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4169E1" />
  <meta name="msapplication-TileColor" content="#4169E1" />

  <!-- Title + description are managed per-route by Seo.jsx via react-helmet-async.
       Modern crawlers (Google, Bing) execute JS, so omitting static fallbacks
       prevents duplicate <title>/<meta name="description"> tags. -->

  <!-- Static OG/Twitter properties that don't vary per page -->
  <meta property="og:type"      content="website" />
  <meta property="og:site_name" content="Prism Paws Pet Care" />
  <meta property="og:image"     content="https://www.yourpetsfavoritehuman.com/assets/images/PRISM_PAWS_LOGO.png" />
  <meta name="twitter:card"     content="summary" />
  <meta name="twitter:site"     content="@PrismPawsPetCare" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Pacifico&family=Caveat+Brush&display=swap" rel="stylesheet" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Prism Paws Pet Care",
    "description": "Concierge-level in-home pet sitting, dog walking, and drop-in visits in Denver, CO. Fully insured, background-checked, and pet-obsessed.",
    "url": "https://www.yourpetsfavoritehuman.com",
    "logo": "https://www.yourpetsfavoritehuman.com/assets/images/PRISM_PAWS_LOGO.png",
    "image": "https://www.yourpetsfavoritehuman.com/assets/images/PRISM_PAWS_LOGO.png",
    "telephone": "+17202891134",
    "email": "mekyla@yourpetsfavoritehuman.com",
    "priceRange": "$$",
    "currenciesAccepted": "USD",
    "paymentAccepted": "Venmo, Zelle, Cash App, Credit Card",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Denver",
      "addressRegion": "CO",
      "addressCountry": "US"
    },
    "areaServed": [
      { "@type": "City", "name": "Denver", "sameAs": "https://en.wikipedia.org/wiki/Denver" },
      { "@type": "AdministrativeArea", "name": "Denver Metro Area, Colorado" }
    ],
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
      "opens": "07:00",
      "closes": "22:00"
    },
    "sameAs": ["https://www.instagram.com/PrismPawsPetCare"],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Pet Care Services",
      "itemListElement": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "In-Home Pet Sitting", "description": "Overnight and extended in-home pet sitting in Denver, CO." } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Dog Walking", "description": "30- and 60-minute dog walks and small pack walks in Denver, CO." } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Drop-In Visits", "description": "20- to 60-minute drop-in pet visits for dogs and cats in Denver, CO." } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Enrichment & TLC", "description": "Sensory play, light massage, and training reinforcement for pets in Denver, CO." } }
      ]
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Prism Paws Pet Care",
    "url": "https://www.yourpetsfavoritehuman.com",
    "inLanguage": "en-US",
    "publisher": { "@type": "Organization", "name": "Prism Paws Pet Care" }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
